[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriforge"
version = "1.0.0rc1"
description = "Formal-verification-guided arithmetic expression research platform (Phase 12 release candidate)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "VERIFORGE" }]
dependencies = [
    "z3-solver==5.1.0.0",
    "streamlit==1.41.1",
    "plotly==5.24.1",
    "pandas==2.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
include = ["veriforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
